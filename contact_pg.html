<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aloydrelayoga - Contact</title>
    <link rel="icon" type="image/png" href="Logo.png">

<style>
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #3A084C;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            text-align: left;
            padding: 20px 20px 20px 50px; 
            margin: 0;

            background-color: #C577E4;
            background-image: url('Logo.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* --- DESKTOP NAVIGATION --- */
        nav {
            margin-bottom: 50px;
            padding: 10px 0;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-left: -30px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        nav.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        .menu li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.2s ease, border 0.2s ease;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent; 
        }

        .menu li a:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .menu li a.active {
            background-color: #3A084C;             /* Deep purple background */
            color: #ffffff;                        /* Crisp white text */
            border: 2px solid #E545F7;             /* Vibrant pink outline to match the theme */
            box-shadow: 0 4px 10px rgba(58, 8, 76, 0.3); /* Soft matching shadow */
            transform: none; 
        }

        /* --- HAMBURGER & MOBILE/SCROLL OVERLAY --- */
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: fixed; 
            top: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .hamburger.visible {
            opacity: 1;
            visibility: visible;
        }

        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
            background-color: #3A084C;
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
            background-color: #3A084C;
        }

        .mobile-nav {
            display: block;
            position: fixed;
            top: 0;
            right: -100%; 
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 999;
            padding-top: 80px;
        }

        .mobile-nav.open {
            right: 0; 
        }

        .mobile-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .mobile-menu li a {
            color: #3A084C;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 10px 20px;
            display: block;
            width: 80%;
            text-align: center;
            border-radius: 5px;
            transition: background 0.2s ease, border 0.2s ease;
            border: 2px solid transparent;
        }

        .mobile-menu li a:hover {
            background-color: rgba(229, 69, 247, 0.2);
        }

        /* Mobile Active Style */
        .mobile-menu li a.active {
            background-color: #3A084C;
            color: #ffffff;
            border: 2px solid #E545F7;
        }

        /* --- CONTENT & FOOTER --- */
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .page-footer {
            bottom: 20px;
            left: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			align-self: flex-start;
            margin-top: auto;
        }

        .footer-icon {
            width: 40px;
            height: 40px;
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .footer-text-link {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            text-decoration: none;
        }

        .footer-title {
            color: #0066cc;
            font-size: 1rem;
            font-weight: 500;
        }

        .footer-copyright {
            color: #000000;
            font-size: 0.95rem;
        }
        
		.image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            margin-top: 20px;
			margin-right: 320px
		}

		.image-container img {
            width: auto;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
		}

        @media (max-width: 768px) {
            nav {
                display: none !important; 
            }
            .hamburger {
                opacity: 1 !important;   
                visibility: visible !important;
            }
            body {
                padding: 20px;
            }
            .page-footer {
                left: 20px;
            }
        }

        /* Colonne de gauche (Infos) */
        .info-gauche {
            flex: 1;
            min-width: 300px;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .info-gauche a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Colonne de droite (Formulaire) */
        .form-droite {
            flex: 1;
            min-width: 320px;
            background-color: #D300FF;
            padding: 30px;
            color: #333333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .form-droite h2 {
            font-size: 1.3rem;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            line-height: 1.4;
            color: #000000;
        }

        /* Style des champs de saisie */
        .form-droite input[type="text"],
        .form-droite input[type="email"],
        .form-droite input[type="tel"],
        .form-droite textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            background-color: #00D4F7;
            color: #333333;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* Couleur des placeholders (textes d'indication en fond de case) */
        .form-droite ::placeholder {
            color: rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .form-droite textarea {
            height: 150px;
            resize: vertical;
        }

        /* Conteneur du bouton pour l'aligner à droite */
        .btn-container {
            display: flex;
            justify-content: flex-end;
        }

        /* Bouton "Envoyer" de l'image */
        .form-droite button {
            background-color: #0004FF;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 10px 25px;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            transition: background 0.2s;
        }

        .form-droite button:hover {
            background-color: #C5B5AC;
        }
        .container-contact {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
</style>
</head>
<body>

<!-- Floating Hamburger Button -->
<button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
    <span></span>

    <span></span>
</button>

<!-- Slide-out Menu -->
<div class="mobile-nav" id="mobile-menu-container">
    <ul class="mobile-menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="about_pg.html">Mon parcours</a></li>
		<li><a href="cours_pg.html">Cours</a></li>
        <li><a href="contact_pg.html" class="active">Contact</a></li> 
		<li><a href="photos_pg.html">Photos</a></li> 
    </ul>
</div>

<br>
<div class="page-footer">
    <div class="footer-icon">©</div>
    <a href="mention_legal.html" class="footer-text-link">
        <span class="footer-title">Mentions Légales</span>
        <span class="footer-copyright">©2026 aloydrelayoga</span>
    </a>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        confetti({
            particleCount: 200,
            spread: 80,
            origin: { y: 1.0 }
        });
    });

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const mobileMenuContainer = document.getElementById('mobile-menu-container');
    const desktopNav = document.getElementById('desktop-nav');

    hamburgerBtn.addEventListener('click', () => {
        hamburgerBtn.classList.toggle('open');
        mobileMenuContainer.classList.toggle('open');
    });

    const mobileLinks = document.querySelectorAll('.mobile-menu a');
    mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
            hamburgerBtn.classList.remove('open');
            mobileMenuContainer.classList.remove('open');
        });
    });

    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            desktopNav.classList.add('hidden');      
            hamburgerBtn.classList.add('visible');   
        } else {
            desktopNav.classList.remove('hidden');   
            hamburgerBtn.classList.remove('visible'); 
            
            hamburgerBtn.classList.remove('open');
            mobileMenuContainer.classList.remove('open');
        }
    });
</script>
</body>
</html>
